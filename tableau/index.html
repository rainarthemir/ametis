<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ametis Live Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    .hidden {
      display: none !important;
    }
    
    .error {
      color: #ff0000;
      font-weight: bold;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

<!-- Верхняя панель -->
<div id="top-banner">
  <div id="route-square"><span id="route-id">--</span></div>
  <div id="next-stop-banner">
    <!-- Текст будет динамически меняться -->
  </div>
</div>

<!-- Основная область -->
<div id="app">
  <div id="dashboard">
    <!-- Убрали выбор трипа, теперь он передается через URL -->
    <div id="stops-display">
      <!-- Здесь будут отображаться остановки -->
    </div>
  </div>

  <div id="map">
    <div id="no-bus-msg" class="hidden">🚫 Aucun bus en service actuellement</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/protobufjs@7.2.5/dist/protobuf.min.js"></script>
<script src="main.js"></script>
</body>
</html>
